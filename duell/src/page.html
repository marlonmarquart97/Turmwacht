 background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#5a3c22 0 16px,#4c321b 16px 17px,#634329 17px 32px);border:3px solid var(--gold);box-shadow:0 5px 0 #000,inset 0 0 0 2px #1a0e05,inset 0 2px 0 rgba(255,220,150,.35);transition:transform .08s}
