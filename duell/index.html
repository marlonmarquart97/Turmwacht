// ---- duell-sim.js ----
// ===== Turmwacht Duell – deterministische Spiellogik =====
// Fester Tick (20/s), eigener Zufallsgenerator im Zustand, keine DOM-/Render-Abhängigkeit.
// Eingaben nur über Befehle {tick, side, a:'play'|'abil', i, card, x, y} -> für späteren Online-Lockstep geeignet.
const DuellSim=(()=>{
const B=(typeof TW_BESTIARY!=='undefined')?TW_BESTIARY:require('./shared/tw-bestiary.js');
const CARDS=B.cards,TICK=1/20,FW=360,FH=640,RY0=306,RY1=334,MIDY=320,BRIDGES=[70,290],BW=42;

const FORM={1:[[0,0]],2:[[-11,0],[11,0]],3:[[0,-10],[-12,8],[12,8]],4:[[-11,-11],[11,-11],[-11,11],[11,11]],5:[[0,0],[-16,-9],[16,-9],[-16,10],[16,10]]};

function rnd(S){let a=S.rs=(S.rs+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function validateDeck(deck){
 if(!Array.isArray(deck)||deck.length!==8)return 'Ein Deck braucht genau 8 Karten.';
 if(new Set(deck).size!==8)return 'Jede Karte darf nur einmal im Deck sein.';
 for(const id of deck)if(!CARDS[id])return 'Unbekannte Karte: '+id;
 const h=deck.filter(id=>CARDS[id].type==='hero').length;
 if(h===0)return 'Jedes Deck braucht genau einen Helden.';if(h>1)return 'Nur ein Held pro Deck erlaubt.';return null;}
function mkPlayer(S,side,deck){const d=deck.slice();for(let i=d.length-1;i>0;i--){const j=Math.floor(rnd(S)*(i+1));[d[i],d[j]]=[d[j],d[i]];}
 return{side,mana:5,regen:1,crowns:0,hand:d.slice(0,4),queue:d.slice(4),heroId:0,heroCharge:0,spent:0,plays:0,leak:0};}
function create(cfg){cfg=cfg||{};const decks=cfg.decks||[B.defaultDeck,B.defaultDeck];
 decks.forEach((d,i)=>{const e=validateDeck(d);if(e)throw new Error('Deck '+(i+1)+': '+e);});
 const S={v:1,tick:0,t:0,phase:'count',countT:COUNT,matchT:MATCH,suddenT:SUDDEN,dbl:false,over:false,winner:-1,reason:'',rs:(cfg.seed|0)||1,nid:1,
  ents:[],proj:[],zones:[],bombs:[],queue:[],ev:[],p:null,stats:[{dmgTower:0},{dmgTower:0}]};
 S.p=[mkPlayer(S,0,decks[0]),mkPlayer(S,1,decks[1])];
 const mods=cfg.mods||[];S.mods=[mods[0]||{},mods[1]||{}];
 S.p.forEach((p,i)=>{const m=S.mods[i];if(m.mana!=null)p.mana=m.mana;if(m.regen)p.regen=m.regen;});
 for(const side of[0,1])for(const T of TPOS){const st=B.towers[T.sub];addEnt(S,{side,cls:'tower',card:T.sub,sub:T.sub,lane:T.lane,x:T.x,y:side?FH-T.y:T.y,r:st.r,hp:st.hp,maxhp:st.hp,st,active:T.sub!=='keep',mass:1e9});}
 for(const e of S.ents)if(e.cls==='tower'){const k=S.mods[e.side].towerHp;if(k){e.hp=e.maxhp=Math.round(e.hp*k);}}
 return S;}
function addEnt(S,o){const e=Object.assign({id:S.nid++,ox:o.x,oy:o.y,tgt:0,cd:0,frz:0,stun:0,slowT:0,slowF:0,dot:0,dotT:0,dep:0,face:o.side?1:-1,atk:0,atkT:-99,air:false,mass:1,retg:0,lock:false,born:S.tick},o);S.ents.push(e);return e;}

// ---------- Platzierung ----------
function inRiver(x,y){return y>RY0-2&&y<RY1+2;}
function zoneOK(S,side,x,y){if(x<8||x>FW-8||y<10||y>FH-10)return false;if(inRiver(x,y))return false;
 if(side===0?y>=RY1+4:y<=RY0-4)return true;

 return side===0?y>=160:y<=FH-160;}
function canPlay(S,side,i,x,y){if(S.over||S.phase==='count')return 'Noch nicht bereit';const p=S.p[side],id=p.hand[i],C=CARDS[id];if(!C)return 'Keine Karte';
 if(p.mana+1e-9<C.cost)return 'Nicht genug Mana';
 if(C.type==='hero'&&p.heroId&&byId(S,p.heroId))return 'Dein Held kämpft bereits';
 if(C.type==='spell')return(x>=0&&x<=FW&&y>=0&&y<=FH)?null:'Außerhalb des Feldes';
 if(!zoneOK(S,side,x,y))return 'Hier nicht erlaubt';
 if(C.type==='bld'){for(const o of S.ents)if((o.cls==='tower'||o.cls==='bld')&&d2(o.x,o.y,x,y)<o.r+C.b.r+2)return 'Zu nah an einem Gebäude';}
 return null;}
function issue(S,cmd,delay){cmd=Object.assign({},cmd);cmd.tick=S.tick+(delay==null?1:delay);if(cmd.a==='play')cmd.card=S.p[cmd.side].hand[cmd.i];S.queue.push(cmd);return cmd;}
function exec(S,c){const p=S.p[c.side];
 if(c.a==='play'){if(p.hand[c.i]!==c.card||canPlay(S,c.side,c.i,c.x,c.y))return;const C=CARDS[c.card];p.mana-=C.cost;p.spent+=C.cost;p.plays++;
  p.queue.push(c.card);p.hand[c.i]=p.queue.shift();deploy(S,c.side,c.card,c.x,c.y);ev(S,'play',{side:c.side,card:c.card,x:c.x,y:c.y});}
 else if(c.a==='abil')ability(S,c.side,c.x,c.y);}
function deploy(S,side,id,x,y){const C=CARDS[id];
 if(C.type==='spell'){castSpell(S,side,id,x,y);return;}
 if(C.type==='bld'){const b=C.b;addEnt(S,{side,cls:'bld',card:id,x,y,r:b.r,hp:b.hp,maxhp:b.hp,st:b,dep:1,life:b.life,tmr:b.spawn?b.spawn.every*.5:(b.mana?b.mana.every:0),mass:1e9});return;}
 const f=FORM[C.count||1]||FORM[1];
 for(const[dx,dy]of f){const e=spawnUnit(S,side,id,clamp(x+dx,8,FW-8),y+(side?-dy:dy),.9);if(C.type==='hero'){S.p[side].heroId=e.id;S.p[side].heroCharge=.4;e.hero=true;}}}
function spawnUnit(S,side,id,x,y,dep){const C=CARDS[id],u=C.u;if(!C.air&&inRiver(x,y))y=(side===0)?RY1+3:RY0-3;
 return addEnt(S,{side,cls:'unit',card:id,x,y,r:u.r,hp:u.hp,maxhp:u.hp,st:u,air:!!C.air,mass:u.mass||1,dep:dep==null?.9:dep});}
// ---------- Zauber & Fähigkeiten ----------
function enemiesIn(S,side,x,y,r,o){o=o||{};const out=[];for(const e of S.ents){if(e.side===side||e.hp<=0||e.thrown||e.leap)continue;if(o.noAir&&e.air)continue;if(o.unitsOnly&&e.cls!=='unit')continue;if(d2(e.x,e.y,x,y)<=r+e.r*.5)out.push(e);}return out;}
function castSpell(S,side,id,x,y){const s=CARDS[id].s;
 if(id==='firerain'){S.zones.push({k:'firerain',side,x,y,r:s.r,t:s.delay,max:s.delay,dmg:s.dmg,tower:s.tower});ev(S,'firerain',{side,x,y,r:s.r});}
 else if(id==='frost'){for(const e of enemiesIn(S,side,x,y,s.r)){hurt(S,e,e.cls==='unit'?s.dmg:s.dmg*s.tower,side);e.frz=Math.max(e.frz,s.freeze);}ev(S,'frost',{side,x,y,r:s.r});}}
function ability(S,side,x,y){const p=S.p[side],h=byId(S,p.heroId);if(!h||p.heroCharge<1||h.leap||h.dep>0||h.frz>0||h.stun>0)return false;const A=CARDS[h.card].abil;
 let tx=x,ty=y;if(A.reach){const d=d2(h.x,h.y,x,y);if(d>A.reach){tx=h.x+(x-h.x)*A.reach/d;ty=h.y+(y-h.y)*A.reach/d;}}
 tx=clamp(tx,8,FW-8);ty=clamp(ty,8,FH-8);
 if(A.key==='leap'){if(inRiver(tx,ty)&&!onBridge(tx))ty=(ty>MIDY)?RY1+4:RY0-4;h.leap={t:0,max:.5,x0:h.x,y0:h.y,x1:tx,y1:ty};h.tgt=0;h.lock=false;ev(S,'leap',{side,x:tx,y:ty});}
 else if(A.key==='nova'){for(const e of enemiesIn(S,side,h.x,h.y,A.r)){hurt(S,e,e.cls==='unit'?A.dmg:A.dmg*.4,side);e.frz=Math.max(e.frz,e.cls==='tower'?A.freeze*.5:A.freeze);}ev(S,'nova',{side,x:h.x,y:h.y,r:A.r});}
 else if(A.key==='cloud'){S.zones.push({k:'cloud',side,x:tx,y:ty,r:A.r,t:A.t,max:A.t,dps:A.dps,slow:A.slow,air:true});ev(S,'cloud',{side,x:tx,y:ty,r:A.r});}
 else if(A.key==='summon'){if(inRiver(tx,ty))ty=(ty>MIDY)?RY1+4:RY0-4;const f=FORM[4];for(const[dx,dy]of f)spawnUnit(S,side,A.summon.card,clamp(tx+dx*1.3,8,FW-8),ty+dy*1.3,.35);ev(S,'summon',{side,x:tx,y:ty});}
 p.heroCharge=0;ev(S,'abil',{side,key:A.key,hero:h.card});return true;}
// ---------- Schaden ----------
function hurt(S,e,amt,srcSide){if(!e||e.hp<=0||amt<=0)return;e.hp-=amt;e.hurtT=S.tick;
 if(e.cls==='tower'){S.stats[srcSide===0?0:1].dmgTower+=amt;if(e.sub==='keep')e.active=true;}
 if(e.hp<=0){e.hp=0;}}
function splashAt(S,side,x,y,r,dmg,o){o=o||{};let n=0;for(const e of S.ents){if(e.side===side||e.hp<=0||e.thrown||e.leap)continue;if(o.air===false&&e.air)continue;if(o.air===true&&!e.air)continue;
  if(d2(e.x,e.y,x,y)<=r+e.r*.6){hurt(S,e,e.cls==='unit'?dmg:dmg*(o.tower==null?1:o.tower),side);n++;
   if(o.knock&&e.cls==='unit'&&!e.air){const d=d2(e.x,e.y,x,y)||1;const k=o.knock*(1-Math.min(1,d/(r*1.2)))+o.knock*.4;e.x+=(e.x-x)/d*k;e.y+=(e.y-y)/d*k;e.stun=Math.max(e.stun,.5);fixPos(e,e.oy);}
   if(o.stun)e.stun=Math.max(e.stun,o.stun);}}return n;}
// ---------- Wegfindung ----------
function onBridge(x){for(const bx of BRIDGES)if(Math.abs(x-bx)<=BW/2)return bx;return null;}

  if(Math.abs(e.x-bx)>7&&!(e.y>RY0-1&&e.y<RY1+1)){gx=bx;gy=e.y>MIDY?RY1+6:RY0-6;}else{gx=bx;gy=e.y>MIDY?RY0-8:RY1+8;}}
 const dx=gx-e.x,dy=gy-e.y,d=Math.sqrt(dx*dx+dy*dy),s=spd*TICK;
 if(d<=s){e.x=gx;e.y=gy;}else{e.x+=dx/d*s;e.y+=dy/d*s;}if(Math.abs(dx)>.5)e.face=dx<0?-1:1;e.mv=true;}
// ---------- Zielwahl ----------
function canHit(st,o){if(o.thrown||o.leap||o.hp<=0)return false;if(st.tg==='bld'&&o.cls==='unit')return false;if(o.air&&st.tg!=='any')return false;return true;}

  if(alive(g))best=g;}

function inRange(e,t){return edge(e,t)<=e.st.range+(t.cls!=='unit'?2:0);}
// ---------- Angriff ----------
function attack(S,e,t){const st=e.st;e.atk++;e.atkT=S.tick;if(t.x!==e.x)e.face=t.x<e.x?-1:1;

 if(st.proj){const P=B.projectiles[st.proj];S.proj.push({id:S.nid++,side:e.side,kind:st.proj,x:e.x,y:e.y,z:e.air?34:(e.cls==='tower'?(e.sub==='keep'?70:58):(e.cls==='bld'?50:18)),ox:e.x,oy:e.y,tid:t.id,tx:t.x,ty:t.y,tz:t.air?30:12,spd:P.spd,arc:P.arc||0,dmg:st.dmg,splash:st.splash||0,src:e.card,st,
  d0:Math.max(1,d2(e.x,e.y,t.x,t.y)),air:t.air});ev(S,'shot',{kind:st.proj,x:e.x,y:e.y,side:e.side});return;}
 hurt(S,t,st.dmg,e.side);ev(S,'hit',{x:t.x,y:t.y,air:t.air,melee:1,card:e.card,tx:e.x,ty:e.y});}

// ---------- Update ----------
function updUnit(S,e){

 if(e.thrown){const T=e.thrown;T.t+=TICK;const k=Math.min(1,T.t/T.max);e.x=T.x0+(T.x1-T.x0)*k;e.y=T.y0+(T.y1-T.y0)*k;if(k>=1){e.thrown=null;ev(S,'land',{x:e.x,y:e.y});fixPos(e,e.y);}return;}
 if(e.leap){const L=e.leap;L.t+=TICK;const k=Math.min(1,L.t/L.max);e.x=L.x0+(L.x1-L.x0)*k;e.y=L.y0+(L.y1-L.y0)*k;
  if(k>=1){e.leap=null;const A=CARDS[e.card].abil;splashAt(S,e.side,e.x,e.y,A.r,A.dmg,{tower:.5,stun:A.stun});ev(S,'slam',{x:e.x,y:e.y,r:A.r,side:e.side});fixPos(e,e.y);}return;}
 const st=e.st;e.mv=false;
 if(e.dotT>0){e.dotT-=TICK;hurt(S,e,e.dot*TICK,e.dotSide);}
 if(e.slowT>0){e.slowT-=TICK;if(e.slowT<=0)e.slowF=0;}
 if(e.frz>0){e.frz-=TICK;return;}if(e.stun>0){e.stun-=TICK;return;}

 if(st.heal){e.healT=(e.healT||0)-TICK;if(e.healT<=0){e.healT=1;let n=0;for(const o of S.ents)if(o.side===e.side&&o.cls==='unit'&&o.hp>0&&o.hp<o.maxhp&&d2(o.x,o.y,e.x,e.y)<=st.heal.r){o.hp=Math.min(o.maxhp,o.hp+st.heal.hps);n++;}if(n)ev(S,'heal',{x:e.x,y:e.y,r:st.heal.r});}}
 let t=byId(S,e.tgt);if(t&&!canHit(st,t))t=null;

function updStatic(S,e){// Türme & Gebäude
 if(e.dep>0){e.dep-=TICK;return;}
 const fr=e.frz>0;if(fr)e.frz-=TICK;
 if(e.cls==='bld'){e.hp-=e.maxhp/e.life*TICK;if(e.hp<=0){e.hp=0;e.expired=true;return;}
  const b=e.st;if(b.spawn){e.tmr-=TICK;if(e.tmr<=0&&!fr){e.tmr=b.spawn.every;e.atkT=S.tick;e.atk++;const fwd=e.side===0?-1:1;
    let lx=e.x,ly=e.y+fwd*b.spawn.throw;ly=e.side===0?Math.min(ly,RY0-26):Math.max(ly,RY1+26);
    const u=spawnUnit(S,e.side,b.spawn.card,e.x,e.y-(e.side===0?6:-6),0);u.thrown={t:0,max:1.1,x0:e.x,y0:e.y,x1:lx,y1:ly};ev(S,'throw',{x:e.x,y:e.y,side:e.side});}}
  if(b.mana){e.tmr-=TICK;if(e.tmr<=0){e.tmr=b.mana.every;const p=S.p[e.side];p.mana=Math.min(MAXM,p.mana+b.mana.amt);ev(S,'mana',{x:e.x,y:e.y,side:e.side});}}
  if(!b.dmg)return;}
 if(e.cls==='tower'&&!e.active)return;
 if(fr)return;
 const st=e.st;let t=byId(S,e.tgt);

 const err=Sim.validateDeck(G.deck);if(err){toast(err);deckEditor(menu);return;}
 G.S=Sim.create({seed:o.seed||seed,decks:[G.deck,O.deck],mods:[{},O.mods]});G.ai=DuellAI.create(O.ai,1,(o.seed||seed)*7+3);G.auto=o.auto?DuellAI.create('bot',0,(o.seed||seed)*3+1):(G.auto?DuellAI.create('bot',0,(o.seed||seed)*3+1):null);
 G.endShown=false;G.sel=null;G.aim=false;G.acc=0;DR.reset();hide();$('app').classList.remove('inmenu');
 $('oppName').textContent=O.name;$('oppImg').src=DR.icon(O.portrait,48);G.paused=false;G.last=performance.now();buildHand(true);banner('Bereit …',1.2);}
function step1(){const S=G.S;if(G.ai){const c=DuellAI.think(G.ai,S);if(c)Sim.issue(S,c);}if(G.auto){const c=DuellAI.think(G.auto,S);if(c)Sim.issue(S,c);}
 Sim.step(S);const ev=S.ev;if(ev.length){DR.onEvents(ev,S);sfxEvents(ev);for(const e of ev){if(e.k==='start')banner('Kampf!',1);else if(e.k==='double')banner('Doppeltes Mana!',1.8);else if(e.k==='sudden')banner('Sudden Death!<small>Der nächste zerstörte Turm entscheidet</small>',2.4);else if(e.k==='tower')banner(e.side===1?'Turm zerstört! 👑':'Dein Turm ist gefallen!',1.4);}}}
G.fast=(sec)=>{const n=Math.round(sec/Sim.TICK);for(let i=0;i<n&&!G.S.over;i++)step1();return{t:G.S.t,over:G.S.over,winner:G.S.winner,crowns:[G.S.p[0].crowns,G.S.p[1].crowns]};};
G.autopilot=on=>{G.auto=on?DuellAI.create('bot',0,12345):null;return !!G.auto;};
G.start=start;G.menu=menu;G.campaign=campaign;G.story=story;G.deckEditor=()=>deckEditor(menu);G.free=free;G.prog=prog;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.1,(now-G.last)/1000||0);G.last=now;
 if(G.S&&!G.paused){G.acc+=dt*G.speed;let n=0;while(G.acc>=Sim.TICK&&n<20){step1();G.acc-=Sim.TICK;n++;}if(G.S.over&&!G.endShown){G.endShown=true;setTimeout(endScreen,1500);}}
 if(G.S){DR.draw(G.S,G.paused?1:Math.min(1,G.acc/Sim.TICK),G.paused?0:dt);hud();}
 else{if(!G.demo)G.demo=Sim.create({seed:1});DR.draw(G.demo,1,dt);}
 if(G.toastT>0){G.toastT-=dt;if(G.toastT<=0)$('toast').classList.remove('show');}
 if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('show');}}
let bannerT=0;function banner(h,t){const b=$('banner');b.innerHTML=h;b.classList.add('show');bannerT=t;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');G.toastT=2.2;}
G.toast=toast;
// ---------- HUD ----------
let lastHand='';
function buildHand(force){const S=G.S,p=S.p[0],key=p.hand.join(',')+'|'+p.queue[0];if(!force&&key===lastHand)return;lastHand=key;
 $('hand').innerHTML=p.hand.map((id,i)=>cardHTML(id,{i,cls:'h'})).join('');$('nextImg').src=DR.icon(CARDS[p.queue[0]].art==='fire'?'firerain':CARDS[p.queue[0]].art,40);
 $('hand').querySelectorAll('.cd').forEach(c=>{c.addEventListener('pointerdown',ev=>cardDown(ev,+c.dataset.i));});G.sel=null;G.aim=false;DR.st.ghost=null;}
function fmt(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function hud(){const S=G.S,p=S.p[0];buildHand();
 const tm=S.phase==='count'?fmt(Sim.MATCH):S.phase==='sudden'?fmt(S.suddenT):fmt(S.matchT);$('timer').textContent=tm;$('timer').className=S.phase==='sudden'?'sd':S.dbl?'dbl':'';
 $('x2').style.display=(S.dbl||S.phase==='sudden')?'':'none';
 $('crE').innerHTML=[0,1,2].map(i=>`<i class="${i<S.p[1].crowns?'on':''}">♛</i>`).join('');$('crP').innerHTML=[0,1,2].map(i=>`<i class="${i<p.crowns?'on':''}">♛</i>`).join('');
 const m=p.mana;$('manaFill').style.width=(m/10*100)+'%';$('manaNum').textContent=Math.floor(m+1e-9);
 $('hand').querySelectorAll('.cd').forEach(c=>{const i=+c.dataset.i,C=CARDS[p.hand[i]];const heroBusy=C.type==='hero'&&p.heroId&&Sim.byId(S,p.heroId);
  c.classList.toggle('poor',m+1e-9<C.cost);c.classList.toggle('busy',!!heroBusy);c.classList.toggle('sel',G.sel===i);c.style.setProperty('--pg',Math.min(1,m/C.cost));});
 const h=p.heroId&&Sim.byId(S,p.heroId),ab=$('abil');
 if(h&&S.phase!=='over'){const A=CARDS[h.card].abil;ab.style.display='';ab.style.setProperty('--ch',p.heroCharge);ab.classList.toggle('ready',p.heroCharge>=1&&h.dep<=0);ab.classList.toggle('aim',G.aim);
  if(ab.dataset.h!==h.card){ab.dataset.h=h.card;$('abilImg').src=DR.icon(CARDS[h.card].art,44);$('abilName').textContent=A.name;}}else{ab.style.display='none';G.aim=false;DR.st.aim=null;}}
function hudBtns(){$('bMus').textContent=SFX.on.music?'🎵':'🔇';$('bSfx').textContent=SFX.on.sfx?'🔊':'🔈';}
// ---------- Eingabe ----------
const stage=$('stage'),cv=$('cv');
function inStage(x,y){const r=cv.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
function worldAt(cx,cy,touch){const r=cv.getBoundingClientRect();return DR.toWorld(cx-r.left,cy-r.top-(touch?26:0));}
function ghostAt(i,cx,cy,touch){const S=G.S,id=S.p[0].hand[i],C=CARDS[id];if(!inStage(cx,cy)){DR.st.ghost={card:id,zone:C.type!=='spell'};return;}
 const[x,y]=worldAt(cx,cy,touch);const err=Sim.canPlay(S,0,i,x,y);DR.st.ghost={card:id,x,y,ok:!err||err==='Nicht genug Mana'&&false,zone:C.type!=='spell',err};}
function tryPlay(i,cx,cy,touch){const S=G.S;const[x,y]=worldAt(cx,cy,touch);const err=Sim.canPlay(S,0,i,x,y);
 if(err){toast(err==='Hier nicht erlaubt'?'Hier nicht erlaubt – nur auf deiner Hälfte (rot = gesperrt)':err);return false;}
 Sim.issue(S,{side:0,a:'play',i,x:Math.round(x),y:Math.round(y)});G.sel=null;DR.st.ghost=null;return true;}
function cardDown(ev,i){ev.preventDefault();audio();if(!G.S||G.paused||G.S.over)return;G.aim=false;DR.st.aim=null;
 const wasSel=G.sel===i;G.sel=i;G.drag={i,sx:ev.clientX,sy:ev.clientY,moved:false,touch:ev.pointerType!=='mouse',wasSel};ghostAt(i,ev.clientX,ev.clientY,G.drag.touch);DR.st.ghost.x=null;}
window.addEventListener('pointermove',ev=>{if(!G.S||G.paused)return;const D=G.drag;
 if(D){if(Math.hypot(ev.clientX-D.sx,ev.clientY-D.sy)>10)D.moved=true;if(D.moved)ghostAt(D.i,ev.clientX,ev.clientY,D.touch);return;}
 if(G.sel!=null&&ev.pointerType==='mouse')ghostAt(G.sel,ev.clientX,ev.clientY,false);
 if(G.aim&&ev.pointerType==='mouse'&&inStage(ev.clientX,ev.clientY)){const[x,y]=worldAt(ev.clientX,ev.clientY,false);DR.st.aim={x,y};}});
window.addEventListener('pointerup',ev=>{const D=G.drag;if(!D)return;G.drag=null;
 if(D.moved){if(inStage(ev.clientX,ev.clientY))tryPlay(D.i,ev.clientX,ev.clientY,D.touch);else{G.sel=null;DR.st.ghost=null;}}
 else if(D.wasSel){G.sel=null;DR.st.ghost=null;}
 else{const S=G.S,id=S.p[0].hand[D.i],C=CARDS[id];DR.st.ghost={card:id,zone:C.type!=='spell'};}});
cv.addEventListener('pointerdown',ev=>{if(!G.S||G.paused||G.S.over||G.drag)return;audio();
 if(G.aim){const[x,y]=worldAt(ev.clientX,ev.clientY,false);Sim.issue(G.S,{side:0,a:'abil',x:Math.round(x),y:Math.round(y)});G.aim=false;DR.st.aim=null;return;}
 if(G.sel!=null)tryPlay(G.sel,ev.clientX,ev.clientY,false);});
$('abil').addEventListener('pointerdown',ev=>{ev.preventDefault();audio();const S=G.S;if(!S||G.paused)return;const p=S.p[0],h=Sim.byId(S,p.heroId);if(!h)return;
 if(p.heroCharge<1){toast('Fähigkeit lädt noch …');return;}const A=CARDS[h.card].abil;G.sel=null;DR.st.ghost=null;
 if(A.self){Sim.issue(S,{side:0,a:'abil',x:Math.round(h.x),y:Math.round(h.y)});return;}
 G.aim=!G.aim;DR.st.aim=G.aim?{x:null}:null;if(G.aim)toast(A.name+': Ziel auf dem Feld antippen');});
window.addEventListener('keydown',ev=>{if(!G.S||G.S.over)return;if(ev.key==='Escape'){if(G.sel!=null||G.aim){G.sel=null;G.aim=false;DR.st.ghost=null;DR.st.aim=null;}else if(!G.paused)pause();else resume();}
 else if(!G.paused&&/^[1-4]$/.test(ev.key)){G.sel=+ev.key-1;const id=G.S.p[0].hand[G.sel];DR.st.ghost={card:id,zone:CARDS[id].type!=='spell'};}
 else if(!G.paused&&(ev.key==='q'||ev.key==='Q'))$('abil').dispatchEvent(new PointerEvent('pointerdown'));});
// ---------- Pause / Ende ----------
function pause(){if(!G.S||G.S.over)return;G.paused=true;const re=()=>{show(`<div class="box"><h2>Pause</h2>${soundRow()}
  <div class="col"><button class="big go" id="bRes">▶ Weiter</button><button class="big" id="bGive">🏳️ Aufgeben</button></div></div>`);bindSound(ov,re);
  $('bRes').onclick=resume;$('bGive').onclick=()=>{G.S.over=true;G.S.phase='over';G.S.winner=1;G.S.reason='Aufgegeben';G.endShown=true;endScreen();};};re();}
function resume(){hide();G.paused=false;G.last=performance.now();}
G.pause=pause;G.resume=resume;
function endScreen(){const S=G.S,w=S.winner,win=w===0,draw=w<0;G.paused=true;let extra='';
 if(G.mode==='camp'){const sc=DUELL_SCEN.find(s=>s.id===G.scen);if(win){const fresh=markWon(sc.id);extra=`<p class="story">${esc(sc.win)}</p>`;
   const nx=DUELL_SCEN.find(s=>s.id===sc.id+1);if(nx&&fresh)extra+=`<p class="unlock">🔓 Szenario ${nx.id} „${esc(nx.title)}“ freigeschaltet!</p>`;}
  else extra=`<p class="story">${esc(sc.lose)}</p>`;}
 try{audio();win?SFX.level():SFX.over();}catch(_){}
 const nx=G.mode==='camp'&&win&&DUELL_SCEN.find(s=>s.id===G.scen+1);
 show(`<div class="box end ${win?'win':draw?'draw':'lose'}"><h1>${win?'Sieg!':draw?'Unentschieden':'Niederlage'}</h1>
  <div class="crowns"><div><small>Du</small>${[0,1,2].map(i=>`<i class="${i<S.p[0].crowns?'on b':''}">♛</i>`).join('')}</div><div><small>${esc(DUELL_OPP[G.opp].name)}</small>${[0,1,2].map(i=>`<i class="${i<S.p[1].crowns?'on r':''}">♛</i>`).join('')}</div></div>
  <p class="sub">${esc(S.reason||'')} · ${fmt(S.t-3)} gespielt · ${S.p[0].plays} Karten</p>${extra}
  <div class="col">${nx?`<button class="big go" id="bNext">▶ Weiter: ${esc(nx.title)}</button>`:''}<button class="big${nx?'':' go'}" id="bAgain">↻ Revanche</button><button class="big" id="bMenu">☰ Menü</button></div></div>`,'e');
 if(nx)$('bNext').onclick=()=>story(nx.id);$('bAgain').onclick=()=>G.mode==='camp'?story(G.scen):start({mode:'free',opp:G.opp});$('bMenu').onclick=()=>{G.S=null;menu();};}
G.endScreen=endScreen;
$('bPause').onclick=()=>{audio();G.paused?resume():pause();};
$('bMus').onclick=()=>{audio();SFX.toggle('music');hudBtns();};$('bSfx').onclick=()=>{audio();SFX.toggle('sfx');hudBtns();};
// ---------- Start ----------
function fit(){DR.resize();}
window.addEventListener('resize',()=>{fit();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.S&&!G.paused&&!G.S.over)pause();});
measureArt();DR.init(cv);hudBtns();menu();requestAnimationFrame(t=>{G.last=t;loop(t);});
})();

</script></body></html>
