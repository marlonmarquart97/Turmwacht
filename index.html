<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3044">
<title>Turmwacht – Der Schattenpass</title>
<!-- Turmwacht v3.3 -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#120c07;font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;color:#f3e2b0;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#120c07}
#hud{display:flex;align-items:center;gap:6px;padding:5px 8px;background:linear-gradient(#4e3420,#24160b);border-bottom:3px solid #b8902f;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,220,150,.2);flex:0 0 auto;z-index:2}
.pill{display:flex;align-items:center;gap:5px;background:linear-gradient(#17110c,#2c2219);border:2px solid #8a6a26;border-radius:5px;padding:2px 9px;font-weight:700;font-size:16px;text-shadow:0 2px 0 #000;white-space:nowrap;box-shadow:inset 0 0 6px #000}
.pill.gold{color:#ffd23a}.pill.lives{color:#ff6a50}
.coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4a8,#e0a820 55%,#7a4a00);border:1px solid #3a2200;vertical-align:-.08em;box-shadow:0 1px 0 #000}
.sp{flex:1}
button{font-family:inherit;color:#f3e2b0;cursor:pointer;touch-action:manipulation;border:none}
.hbtn{background:linear-gradient(#6a5236,#34251a);border:2px solid #b8902f;border-radius:5px;font-weight:700;font-size:15px;padding:3px 9px;text-shadow:0 2px 0 #000;min-width:42px;box-shadow:inset 0 1px 0 rgba(255,220,150,.3),0 2px 0 #000}
.hbtn:active{transform:translateY(1px)}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden;background:#0c0804}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#panel{flex:0 0 auto;display:grid;gap:6px;padding:7px;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.5)),repeating-linear-gradient(90deg,#3e2815 0 14px,#35220f 14px 15px,#432c17 15px 30px);z-index:2;box-shadow:inset 0 0 12px #000}
@media (orientation:portrait){#main{flex-direction:column}#panel{grid-template-columns:repeat(5,1fr);border-top:3px solid #b8902f}#startBtn{grid-column:span 2}}
@media (orientation:landscape) and (max-height:500px){#card{width:min(70%,380px);padding:5px 8px}#card .d{font-size:12px;margin:2px 0 4px}.cbtn{padding:4px}}
@media (orientation:landscape){#panel{width:178px;grid-template-columns:1fr 1fr;align-content:start;overflow-y:auto;border-left:3px solid #b8902f}#startBtn{grid-column:span 2}}
.bbtn{position:relative;background:linear-gradient(#5e5850,#2a2722);border:2px solid #9a7a30;border-radius:5px;padding:3px 2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:66px;overflow:hidden;box-shadow:inset 0 0 0 2px #15120e,inset 0 3px 0 rgba(255,255,255,.12),0 3px 0 #000}
.icon{width:44px;height:44px;display:block;pointer-events:none}
.icon.sm{width:28px;height:28px;display:inline-block;vertical-align:middle}
.bbtn .nm{font-size:11px;font-weight:700;line-height:12px;text-align:center;color:#f3e2b0;text-shadow:0 1px 0 #000}
.bbtn .ct{font-size:12px;font-weight:700;color:#ffd23a;text-shadow:0 1px 0 #000}
.bbtn.sel{border-color:#ffe27a;background:linear-gradient(#7a6e52,#3e3628);box-shadow:0 0 10px #ffc830,inset 0 0 0 2px #15120e}
.bbtn.poor{filter:grayscale(.85) brightness(.7)}
.bbtn:active{transform:translateY(2px)}
.bbtn.spell{background:linear-gradient(#4a3470,#1c1230);border-color:#8a70c0}
.bbtn.spell.sel{border-color:#ffb060;box-shadow:0 0 10px #ff8020,inset 0 0 0 2px #15120e}
.bbtn .cd{position:absolute;inset:0;background:conic-gradient(rgba(5,5,10,.75) calc(var(--p,0)*1turn),transparent 0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;text-shadow:0 2px 2px #000}
#startBtn{background:linear-gradient(#7a2a18,#3a1008);border:2px solid #d4a94a;border-radius:5px;font-weight:700;font-size:17px;color:#ffe2a0;text-shadow:0 2px 0 #000;min-height:66px;padding:4px;box-shadow:inset 0 0 0 2px #1a0804,inset 0 3px 0 rgba(255,200,150,.2),0 3px 0 #000}
#startBtn:active{transform:translateY(2px)}
#startBtn.off{background:linear-gradient(#4a4540,#25221e);border-color:#6a5a3a;color:#bbb}
#card{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:min(96%,430px);background:linear-gradient(rgba(46,32,18,.97),rgba(22,14,8,.97));border:2px solid #c9a227;border-radius:6px;padding:8px 10px;display:none;box-shadow:0 6px 16px rgba(0,0,0,.6),inset 0 0 0 1px #000;z-index:3}
#card.show{display:block}
#card .t .x{min-width:44px;min-height:36px;display:flex;align-items:center;justify-content:center}
#heroSel{position:absolute;left:6px;bottom:6px;z-index:2;width:54px;height:58px;border-radius:8px;background:linear-gradient(#3a3060,#16122a);border:2px solid #c9a227;padding:2px;box-shadow:0 3px 0 #000,inset 0 0 0 1px #000}
#heroSel canvas{width:44px;height:44px;margin:0 auto}#heroSel .hp{position:absolute;left:4px;right:4px;bottom:3px;height:5px;background:#300;border:1px solid #000}#heroSel .hp b{display:block;height:100%;background:#3ec43a}
#heroSel .lv{position:absolute;top:-6px;right:-6px;font:700 11px sans-serif;color:#fff;background:#3a2a6a;border:1.5px solid #ffd040;border-radius:9px;min-width:18px;height:18px;line-height:15px;text-align:center}
#heroSel.sel{border-color:#ffe27a;box-shadow:0 0 12px #ffc830,0 3px 0 #000}#heroSel.dead{filter:grayscale(1) brightness(.6)}#heroSel.hidecard{display:none}
#card.top{bottom:auto;top:8px}
@media (orientation:landscape) and (max-height:500px){#card{width:min(72%,400px);padding:5px 8px}#card .d{font-size:12px;margin:2px 0 4px}.cbtn{padding:4px}}
#card .t{font-weight:700;font-size:16px;color:#ffd870;display:flex;align-items:center;gap:6px;text-shadow:0 1px 0 #000}
#card .t .x{margin-left:auto;background:linear-gradient(#8a2a1a,#4a1008);border:1px solid #c9a227;border-radius:4px;padding:1px 9px;font-size:15px}
#card .d{font-size:13px;color:#e8dcc0;margin:3px 0 6px;line-height:1.3}
#card .row{display:flex;gap:6px}
.cbtn{flex:1;border-radius:5px;padding:6px 6px;font-weight:700;font-size:14px;text-shadow:0 1px 0 #000;border:1px solid #c9a227;line-height:1.2;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 2px 0 #000}
.cbtn small{display:block;font-size:11px;font-weight:400;opacity:.9}
.cbtn.up,.cbtn.ok{background:linear-gradient(#3e7a2a,#1a4210)}.cbtn.sell{background:linear-gradient(#8a4a1a,#4a2008);flex:0 0 34%}
.cbtn.no{background:linear-gradient(#7a2a1a,#3a1008);flex:0 0 30%}
.herob .mana{position:absolute;left:3px;right:3px;bottom:2px;height:5px;background:#0a0a1a;border:1px solid #000;border-radius:2px}.herob .mana i{display:block;height:100%;width:0;background:linear-gradient(#7ab8ff,#2a5ad0);border-radius:2px}
.herob .lvl{position:absolute;top:2px;left:3px;font-size:10px;font-weight:700;color:#fff;background:#3a2a6a;border:1px solid #c9a227;border-radius:8px;padding:0 4px}
.herob.dead{filter:grayscale(1) brightness(.6)}
.heroes{display:flex;gap:6px;justify-content:center;margin:8px 0}.heroes button{flex:1;max-width:150px;background:linear-gradient(#3e3830,#1e1a16);border:2px solid #6a5a30;border-radius:6px;color:#f3e2b0;padding:4px;font:inherit;font-size:12px}
.heroes button.on{border-color:#ffd040;box-shadow:0 0 10px #ffb020}.heroes canvas{width:54px;height:54px;display:block;margin:0 auto}.heroes small{display:block;opacity:.85;font-size:10.5px;line-height:12px}
@media (orientation:landscape) and (max-height:500px){.bbtn,#startBtn{min-height:50px}.bbtn canvas.icon{width:30px;height:30px}#startBtn{font-size:14px}}
.hbtn.snd{min-width:0;padding:3px 5px}.hbtn.snd .x{display:none}.hbtn.snd.off .x{display:inline}.hbtn.snd.off{opacity:.7}
@media (max-width:430px){.hbtn{min-width:0;padding:3px 6px;font-size:13px}}
.tmb{background:linear-gradient(#3a4a6a,#1a2238);border:1px solid #c9a227;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700;color:#e8e0ff;margin-left:6px}
#startBtn small{display:block;font-size:11px;font-weight:400;color:#ffe9b0}
.pill.best{color:#ffe070}
.cbtn:disabled{filter:grayscale(1) brightness(.6)}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:linear-gradient(rgba(40,26,12,.92),rgba(20,12,6,.92));border:2px solid #c9a227;border-radius:5px;padding:6px 14px;font-weight:700;font-size:15px;color:#ffe2a0;pointer-events:none;opacity:0;transition:opacity .25s;white-space:normal;max-width:94%;width:max-content;z-index:3;text-align:center;text-shadow:0 1px 0 #000}
#card.top~#toast{top:auto;bottom:66px}
#toast.show{opacity:1}
#ov{position:fixed;inset:0;background:radial-gradient(rgba(20,10,4,.6),rgba(4,2,0,.9));display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
#ov.hide{display:none}
#pmenu{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:min(92%,360px);background:linear-gradient(#2a1c10,#140c06);border:2px solid #c9a227;border-radius:8px;padding:10px;box-shadow:0 6px 24px #000;text-align:center;color:#f3e2b0}#pmenu.show{display:block}#pmenu .pt{font:700 20px Palatino,Georgia,serif;color:#ffd870;margin-bottom:2px}#pmenu .big{margin-top:4px}.heroes.mus button{padding:7px 4px}.heroes.mus b{display:block;font-size:13px}
.box{background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.45)),linear-gradient(#4a3a2a,#231a12);border:3px solid #c9a227;border-radius:8px;padding:18px 20px;max-width:460px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.8),inset 0 0 0 2px #000,inset 0 0 30px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.box h1{font-size:32px;color:#ffd23a;text-shadow:0 3px 0 #4a2a00,0 0 14px rgba(255,180,40,.45);line-height:1.1;letter-spacing:1px}
.box h2{font-size:15px;color:#e0c890;margin:4px 0 10px;font-style:italic}
.box p,.box li{font-size:14px;line-height:1.4;color:#efe3c6;text-align:left}
.box ul{margin:0 0 12px 0;list-style:none}
.box li{display:flex;align-items:center;gap:6px;margin:2px 0}
.big{background:linear-gradient(#7a2a18,#3a1008);color:#ffe2a0;border:2px solid #d4a94a;border-radius:6px;font-weight:700;font-size:22px;padding:10px 28px;margin-top:6px;text-shadow:0 2px 0 #000;box-shadow:inset 0 3px 0 rgba(255,200,150,.2),0 4px 0 #000}
.big:active{transform:translateY(2px)}
.gi{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.16em;flex:none;filter:drop-shadow(0 1.5px 0 #000)}

/* --- kompakt für Handys --- */
@media (max-width:480px),(max-height:500px){
 #hud{gap:4px;padding:3px 5px;border-bottom-width:2px}
 .pill{font-size:14px;padding:1px 6px;gap:3px;border-width:1.5px}
 .hbtn{font-size:13px;padding:2px 6px;min-width:0;border-width:1.5px}
 #panel{gap:4px;padding:4px}
 .bbtn{min-height:50px;padding:2px 1px;border-width:1.5px}
 .bbtn canvas.icon{width:30px;height:30px}
 .bbtn .nm{font-size:10.5px;line-height:11px}.bbtn .ct{font-size:11.5px}
 .bbtn .cd{font-size:16px}
 #startBtn{min-height:50px;font-size:14px;padding:2px}#startBtn small{font-size:10.5px}
 #card{padding:5px 7px;bottom:5px;width:min(97%,400px)}
 #card .t{font-size:14px;gap:4px}#card .t .x{min-width:40px;min-height:32px;font-size:14px}
 #card .d{font-size:12px;margin:2px 0 4px;line-height:1.25}
 .cbtn{font-size:12.5px;padding:4px}.cbtn small{font-size:10.5px}
 .icon.sm{width:22px;height:22px}
 .tmb{font-size:11px;padding:1px 5px;margin-left:2px}
 #toast{font-size:13px;padding:4px 10px;top:6px}
 #heroSel{width:46px;height:50px}.herob{padding-bottom:9px}#heroSel canvas{width:36px;height:36px}
}
@media (max-width:370px){.pill{font-size:13px;padding:1px 4px}.hbtn{padding:2px 4px}.bbtn .nm{font-size:10px}.pill .gi{width:.95em;height:.95em}}
@media (orientation:landscape) and (max-height:500px){#panel{width:156px}.bbtn{min-height:44px}.bbtn canvas.icon{width:26px;height:26px}#startBtn{min-height:44px}}
/* v3.3: Übersichten, Bestenliste */
#own,#foe{position:absolute;top:6px;z-index:2;font:700 12px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#ffe2a0;text-shadow:0 1px 0 #000;pointer-events:auto;max-width:calc(50% - 10px)}
#own{left:6px}#foe{right:6px;text-align:right}
.ovb{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(rgba(40,26,12,.88),rgba(20,12,6,.88));border:1.5px solid #c9a227;border-radius:6px;padding:3px 6px;min-height:28px;cursor:pointer;color:#ffe2a0;font:inherit;box-shadow:0 2px 0 #000}
#own .ovb{border-color:#4a90e0}#foe .ovb{border-color:#d84a3a}
.ovb .ar{opacity:.8;font-size:10px}
.ovl{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;background:rgba(14,9,4,.82);border:1px solid rgba(201,162,39,.55);border-radius:6px;padding:3px;max-height:96px;overflow:hidden}
#foe .ovl{justify-content:flex-end}
.ovl.hide{display:none}
.chip{display:inline-flex;align-items:center;gap:1px;background:rgba(255,255,255,.06);border-radius:4px;padding:0 3px 0 1px;white-space:nowrap}
.chip img{width:22px;height:22px;display:block}.chip b{font-size:12px}.chip.el{box-shadow:inset 0 0 0 1px var(--c,#fff)}
.chip.boss b{color:#d8a8ff}.chip.dead{opacity:.45}
.ovt{width:100%;font-size:10.5px;opacity:.85;padding:0 2px}
#own .chip{box-shadow:inset 0 -2px 0 #3a7ad0}#foe .chip{box-shadow:inset 0 -2px 0 #c0392b}
@media (max-width:430px){#own,#foe{font-size:11px}.chip img{width:19px;height:19px}.chip b{font-size:11px}.ovb{min-height:26px;padding:2px 5px}.ovl{max-height:76px}}
#card.top~#own,#card.top~#foe{top:auto;bottom:66px}
.hs{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px}.hs th,.hs td{padding:3px 5px;border-bottom:1px solid rgba(201,162,39,.3);text-align:left}.hs th{color:#ffd23a;font-size:12px}.hs td.n{text-align:right}.hs tr.me td{background:rgba(255,208,64,.18);color:#fff2c0}
.hsin{display:flex;gap:6px;justify-content:center;align-items:center;margin:6px 0;flex-wrap:wrap}.hsin input{font:inherit;font-size:16px;padding:6px 8px;border-radius:5px;border:2px solid #c9a227;background:#1a1008;color:#ffe2a0;width:min(60vw,220px)}
.sm2{background:linear-gradient(#3a2a12,#1e1408);color:#ffe2a0;border:2px solid #c9a227;border-radius:6px;font-weight:700;font-size:15px;padding:7px 14px}
.box{position:relative}.ver{position:absolute;top:6px;right:9px;font-size:11px;opacity:.65}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pill lives"><svg class="gi" viewBox="0 0 24 24"><path d="M12 21 3.5 12.5A5 5 0 0 1 12 6a5 5 0 0 1 8.5 6.5Z" fill="#e8402a" stroke="#120b05" stroke-width="2"/><path d="M7 9.5a2.5 2.5 0 0 1 3-1.5" stroke="#ffb0a0" stroke-width="1.6" fill="none"/></svg> <span id="hLives">20</span></div>
    <div class="pill gold"><i class="coin"></i> <span id="hGold">0</span></div>
    <div class="pill"><svg class="gi" viewBox="0 0 24 24"><path d="M4 3l9 11M20 3l-9 11" stroke="#120b05" stroke-width="4.5"/><path d="M4 3l9 11M20 3l-9 11" stroke="#d8dce2" stroke-width="2.2"/><path d="M6 13l5 5M18 13l-5 5" stroke="#8a5a20" stroke-width="3.5" stroke-linecap="round"/><path d="M8 19l-3 2M16 19l3 2" stroke="#ffd040" stroke-width="3" stroke-linecap="round"/></svg> <span id="hWave">0/10</span></div>
    <div class="pill best" title="Rekord"><svg class="gi" viewBox="0 0 24 24"><path d="M6 3h12v4a6 6 0 0 1-12 0Z" fill="#ffd040" stroke="#120b05" stroke-width="1.8"/><path d="M6 5H3a3 3 0 0 0 3 4M18 5h3a3 3 0 0 1-3 4" stroke="#120b05" stroke-width="1.6" fill="none"/><path d="M10 13h4v4h3v3H7v-3h3Z" fill="#c98a20" stroke="#120b05" stroke-width="1.6"/></svg> <span id="hBest">0</span></div>
    <div class="sp"></div>
    <button class="hbtn snd" id="musBtn" title="Musik"><svg class="gi" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="#ffd040" stroke-width="2.4"/><circle cx="6.5" cy="18" r="3" fill="#ffd040" stroke="#120b05" stroke-width="1.5"/><circle cx="17.5" cy="16" r="3" fill="#ffd040" stroke="#120b05" stroke-width="1.5"/><path class="x" d="M3 3l18 18" stroke="#e03a2a" stroke-width="3"/></svg></button>
    <button class="hbtn snd" id="sfxBtn" title="Effekte"><svg class="gi" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Z" fill="#ffd040" stroke="#120b05" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#ffd040" stroke-width="2"/><path class="x" d="M3 3l18 18" stroke="#e03a2a" stroke-width="3"/></svg></button>
    <button class="hbtn" id="speedBtn"><svg class="gi" viewBox="0 0 24 24"><path d="M2 5l10 7-10 7ZM12 5l10 7-10 7Z" fill="#ffd040" stroke="#120b05" stroke-width="1.8" stroke-linejoin="round"/></svg> 1x</button>
    <button class="hbtn" id="pauseBtn"><svg class="gi" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" fill="#ffd040" stroke="#120b05" stroke-width="2"/><rect x="14" y="4" width="5" height="16" fill="#ffd040" stroke="#120b05" stroke-width="2"/></svg></button>
  </div>
  <div id="main">
    <div id="stage"><canvas id="cv"></canvas><button id="heroSel" title="Held auswählen"><canvas class="icon" data-icon=""></canvas><i class="hp"><b></b></i><span class="lv">1</span></button><div id="card"></div><div id="own"></div><div id="foe"></div><div id="toast"></div><div id="pmenu"></div></div>
    <div id="panel">
      <button class="bbtn" data-b="archer"><canvas class="icon" data-icon="archer"></canvas><span class="nm">Elfen-Schützen</span><span class="ct"><i class="coin"></i> 100</span></button>
      <button class="bbtn" data-b="catapult"><canvas class="icon" data-icon="catapult"></canvas><span class="nm">Ork-Katapult</span><span class="ct"><i class="coin"></i> 160</span></button>
      <button class="bbtn" data-b="mage"><canvas class="icon" data-icon="mage"></canvas><span class="nm">Magier</span><span class="ct"><i class="coin"></i> 220</span></button>
      <button class="bbtn" data-b="alch"><canvas class="icon" data-icon="alch"></canvas><span class="nm">Alchemist</span><span class="ct"><i class="coin"></i> 180</span></button>
      <button class="bbtn" data-b="mine"><canvas class="icon" data-icon="mine"></canvas><span class="nm">Goldmine</span><span class="ct"><i class="coin"></i> 120</span></button>
      <button class="bbtn spell" data-s="fire"><canvas class="icon" data-icon="fire"></canvas><span class="nm">Feuerregen</span><span class="ct sc"></span><span class="cd"></span></button>
      <button class="bbtn spell" data-s="frost"><canvas class="icon" data-icon="frost"></canvas><span class="nm">Frost</span><span class="ct sc"></span><span class="cd"></span></button>
      <button class="bbtn herob" id="heroBtn"><span class="lvl" id="hLvl">1</span><canvas class="icon" data-icon=""></canvas><span class="nm" id="hAb">Heldensprung</span><span class="ct" id="hMc" style="color:#9ac8ff">50 Mana</span><div class="mana"><i id="hMana"></i></div><span class="cd"></span></button>
      <button id="startBtn"><svg class="gi" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8Z" fill="#ffd040" stroke="#120b05" stroke-width="2" stroke-linejoin="round"/></svg> Welle 1</button>
    </div>
  </div>
</div>
<div id="ov"></div>
<script>

function toWorld(ev){const r=cv.getBoundingClientRect();const vx=(ev.clientX-r.left-ox)/scale,vy=(ev.clientY-r.top-oy)/scale;return portrait?{x:vy,y:vx}:{x:vx,y:vy};}
let down=null;
function heroHit(p){const h=G.hero;if(!h||h.dead)return false;const r=Math.max(30,36/scale);return dist(p.x,p.y,h.x,h.y-18)<r;}
function selectHero(on){sel=null;ghost=null;aim=null;mode=on?{type:'hero'}:null;uiKey=null;}
function clearSel(){mode=null;ghost=null;sel=null;aim=null;uiKey=null;}

 if(mode&&(mode.type==='spell'||mode.type==='ability'||(mode.type==='hero'&&!down.hero)))aim=p;
 try{cv.setPointerCapture(ev.pointerId);}catch(e){}});
cv.addEventListener('pointermove',ev=>{const p=toWorld(ev);
 if(!down){if(ev.pointerType==='mouse'){if(mode&&mode.type==='build')ghost=p;if(mode&&(mode.type==='spell'||mode.type==='ability'||mode.type==='hero'))aim=p;cv.style.cursor=heroHit(p)?'pointer':'';}return;}
 if(dist(p.x,p.y,down.x,down.y)>8)down.moved=true;
 if(mode&&mode.type==='build'&&down.moved&&!down.hero)ghost=p;if(mode&&(mode.type==='spell'||mode.type==='ability'||(mode.type==='hero'&&!down.hero)))aim=p;});
cv.addEventListener('pointerup',ev=>{if(!down)return;const p=toWorld(ev),d=down;down=null;const inF=p.x>=0&&p.y>=0&&p.x<=W&&p.y<=H;

 if(mode&&mode.type==='ability'){if(inF)heroCast(p.x,p.y);uiKey=null;return;}
 // Held antippen hat Vorrang (außer man bestätigt gerade einen Bauplatz)
 const confirming=mode&&mode.type==='build'&&d.prev&&dist(p.x,p.y,d.prev.x,d.prev.y)<34;
 if(d.hero&&!d.moved&&heroHit(p)&&!confirming){selectHero(!(mode&&mode.type==='hero'));return;}
 if(mode&&mode.type==='build'){
  if(d.type==='mouse'){ghost=p;place(mode.kind,p.x,p.y);}
  else if(!d.moved&&d.prev&&dist(p.x,p.y,d.prev.x,d.prev.y)<34){place(mode.kind,d.prev.x,d.prev.y);}
  uiKey=null;return;}
 if(mode&&mode.type==='hero'){
  if(d.hero)return;
